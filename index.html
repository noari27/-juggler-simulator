<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ジャグラー実戦シミュレーター</title>
<style>
:root{
  --bg:#0f1115; --card:#181c23; --muted:#9aa4b2; --text:#f4f7fb; --accent:#4f8cff;
  --good:#48c78e; --bad:#ff6b6b; --line:#2a313c; --warn:#f5b942;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b0e12,#121722 40%,#0f1115);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:24px;margin:4px 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:rgba(24,28,35,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
select,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#11161d;color:var(--text);font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{flex:1;min-width:140px;padding:13px 16px;border:0;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer}
.primary{background:var(--accent);color:white}.secondary{background:#252c36;color:var(--text);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#11161d;border:1px solid var(--line);border-radius:14px;padding:12px}.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:21px;font-weight:800;margin-top:4px}
.positive{color:var(--good)}.negative{color:var(--bad)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.bb{background:rgba(79,140,255,.16);color:#82aaff}.reg{background:rgba(245,185,66,.16);color:#ffd166}
.note{font-size:12px;color:var(--muted);line-height:1.6}.result-title{font-size:18px;font-weight:800;margin-bottom:12px}.empty{color:var(--muted);text-align:center;padding:24px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>ジャグラー実戦シミュレーター</h1>
  <div class="sub">1回ごとに新しい乱数で実戦を再現します。</div>

  <div class="card">
    <div class="grid">
      <div><label>機種</label><select id="machine">
        <option value="my5">マイジャグラーV</option>
        <option value="neoim">ネオアイムジャグラーEX</option>
        <option value="imex">アイムジャグラーEX</option>
        <option value="gogo3">ゴーゴージャグラー3</option>
        <option value="happy3">ハッピージャグラーV III</option>
        <option value="funky2">ファンキージャグラー2</option>
        <option value="girlsSS">ジャグラーガールズSS</option>
        <option value="mr">ミスタージャグラー</option>
        <option value="ultra">ウルトラミラクルジャグラー</option>
      </select></div>
      <div><label>設定</label><select id="setting"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
      <div><label>目標ゲーム数</label><input id="targetG" type="number" value="1000" min="100" step="100"></div>
      <div><label>投資上限（円）</label><input id="limitYen" type="number" value="15000" min="1000" step="1000"></div>
    </div>
    <div class="row">
      <button class="primary" onclick="simulate()">シミュレーション開始</button>
      <button class="secondary" onclick="simulate()">もう一度</button>
    </div>
    <div class="note" style="margin-top:12px">終了ルール：目標G数まで残り100G以内でボーナス当選した場合、そのボーナスで終了。持ちメダルがなく、追加投資すると投資上限を超える場合も終了。</div>
  </div>

  <div class="card" id="summaryCard">
    <div class="empty">シミュレーションを開始してください。</div>
  </div>

  <div class="card">
    <div class="result-title">当選履歴</div>
    <div class="table-wrap"><table><thead><tr><th>累計G</th><th>当選</th><th>当選まで</th><th>投資</th><th>持ちメダル</th></tr></thead><tbody id="history"><tr><td colspan="5" class="empty">まだ履歴がありません。</td></tr></tbody></table></div>
  </div>

  <div class="card note">
    計算前提：46枚貸し、50枚＝1,000円換算。通常時ベースは約40G/46枚、BB約240枚、REG約96枚として簡易計算しています。実機の小役・ボーナス中の細かな増減は簡略化しています。
  </div>
</div>
<script>
const specs={
  my5:{name:'マイジャグラーV',settings:{
    1:{bb:273.1,reg:409.6},2:{bb:270.8,reg:385.5},3:{bb:266.4,reg:336.1},4:{bb:254.0,reg:290.0},5:{bb:240.1,reg:268.6},6:{bb:229.1,reg:229.1}
  }},
  neoim:{name:'ネオアイムジャグラーEX',settings:{
    1:{bb:273.1,reg:439.8},2:{bb:269.7,reg:399.6},3:{bb:269.7,reg:331.0},4:{bb:259.0,reg:315.1},5:{bb:259.0,reg:255.0},6:{bb:255.0,reg:255.0}
  }},
  imex:{name:'アイムジャグラーEX',settings:{
    1:{bb:273.1,reg:439.8},2:{bb:269.7,reg:399.6},3:{bb:269.7,reg:331.0},4:{bb:259.0,reg:315.1},5:{bb:259.0,reg:255.0},6:{bb:255.0,reg:255.0}
  }},
  gogo3:{name:'ゴーゴージャグラー3',settings:{
    1:{bb:259.0,reg:354.2},2:{bb:258.0,reg:332.7},3:{bb:257.0,reg:306.2},4:{bb:254.0,reg:268.6},5:{bb:247.3,reg:247.3},6:{bb:234.9,reg:234.9}
  }},
  happy3:{name:'ハッピージャグラーV III',settings:{
    1:{bb:273.1,reg:397.2},2:{bb:270.8,reg:362.1},3:{bb:263.2,reg:332.7},4:{bb:254.0,reg:300.6},5:{bb:239.2,reg:273.1},6:{bb:226.0,reg:256.0}
  }},
  funky2:{name:'ファンキージャグラー2',settings:{
    1:{bb:266.4,reg:439.8},2:{bb:259.0,reg:407.1},3:{bb:256.0,reg:366.1},4:{bb:249.2,reg:322.8},5:{bb:240.1,reg:299.3},6:{bb:219.9,reg:262.1}
  }},
  girlsSS:{name:'ジャグラーガールズSS',settings:{
    1:{bb:273.1,reg:381.0},2:{bb:270.8,reg:350.5},3:{bb:260.1,reg:316.6},4:{bb:250.1,reg:281.3},5:{bb:243.6,reg:270.8},6:{bb:226.0,reg:252.1}
  }},
  mr:{name:'ミスタージャグラー',settings:{
    1:{bb:268.6,reg:374.5},2:{bb:267.5,reg:354.2},3:{bb:260.1,reg:331.0},4:{bb:249.2,reg:291.3},5:{bb:240.9,reg:257.0},6:{bb:237.4,reg:237.4}
  }},
  ultra:{name:'ウルトラミラクルジャグラー',settings:{
    1:{bb:267.5,reg:425.6},2:{bb:261.1,reg:402.1},3:{bb:256.0,reg:350.5},4:{bb:242.7,reg:322.8},5:{bb:233.2,reg:297.9},6:{bb:216.3,reg:277.7}
  }}
};

const COIN_PER_1000=46;
const G_PER_46=40;
const COIN_PER_GAME=COIN_PER_1000/G_PER_46;
const BB_PAY=240;
const REG_PAY=96;

function rand(){return Math.random()}

function nextBonus(bbDen,regDen){
  const pBB=1/bbDen,pREG=1/regDen,pAny=pBB+pREG;
  const u=Math.max(1e-12,rand());
  const gap=Math.max(1,Math.floor(Math.log(u)/Math.log(1-pAny))+1);
  const type=rand()<pBB/pAny?'BB':'REG';
  return {gap,type};
}

/*
  requestedGだけ回す処理。
  旧版のバグは「次のボーナスまで必要な総投資」を先に計算し、
  それが上限を超えると1Gも回さず終了していたこと。
  新版は1000円単位で使える投資を実際に追加し、
  上限までで回せるG数だけ必ず進めてから終了する。
*/
function playGames(requestedG, coins, invest, limitYen){
  if(requestedG<=0) return {played:0, coins, invest, completed:true};

  const needCoins=requestedG*COIN_PER_GAME;

  // 手持ちだけで全部回せる
  if(coins+1e-9>=needCoins){
    return {
      played:requestedG,
      coins:Math.max(0,coins-needCoins),
      invest,
      completed:true
    };
  }

  // 全部回すのに必要な追加投資単位
  const deficit=Math.max(0,needCoins-coins);
  const unitsNeeded=Math.ceil((deficit-1e-9)/COIN_PER_1000);
  const affordableUnits=Math.max(0,Math.floor((limitYen-invest)/1000));
  const buyUnits=Math.min(unitsNeeded,affordableUnits);

  coins += buyUnits*COIN_PER_1000;
  invest += buyUnits*1000;

  // 追加投資後、全部回せる
  if(coins+1e-9>=needCoins){
    return {
      played:requestedG,
      coins:Math.max(0,coins-needCoins),
      invest,
      completed:true
    };
  }

  // 上限まで投資しても足りない場合は、持ちメダルで回せるところまで回す
  const playable=Math.max(0,Math.floor((coins+1e-9)/COIN_PER_GAME));
  coins=Math.max(0,coins-playable*COIN_PER_GAME);

  return {
    played:playable,
    coins,
    invest,
    completed:false
  };
}

function simulate(){
  const machine=document.getElementById('machine').value;
  const setting=+document.getElementById('setting').value;
  const targetG=Math.max(100,+document.getElementById('targetG').value||1000);
  // 投資は1000円単位なので、入力上限を1000円単位で利用
  const rawLimit=Math.max(0,+document.getElementById('limitYen').value||0);
  const limitYen=Math.floor(rawLimit/1000)*1000;
  const spec=specs[machine].settings[setting];

  let g=0, coins=0, invest=0, bb=0, reg=0, rows=[];
  let stopped='目標G数到達';

  while(g<targetG){
    const nb=nextBonus(spec.bb,spec.reg);
    const remaining=targetG-g;

    // 次の当たりが目標Gより後なら、目標まで回す
    if(nb.gap>remaining){
      const p=playGames(remaining,coins,invest,limitYen);
      g+=p.played; coins=p.coins; invest=p.invest;

      if(!p.completed){
        stopped='投資上限到達';
      }else{
        stopped='目標G数到達';
      }
      break;
    }

    // 次のボーナスまで回す。上限で途中停止した場合も、回せたG数は反映する
    const p=playGames(nb.gap,coins,invest,limitYen);
    g+=p.played; coins=p.coins; invest=p.invest;

    if(!p.completed){
      stopped='投資上限到達';
      break;
    }

    // ボーナス到達
    if(nb.type==='BB'){
      bb++;
      coins+=BB_PAY;
    }else{
      reg++;
      coins+=REG_PAY;
    }

    rows.push({
      g,
      type:nb.type,
      gap:nb.gap,
      invest,
      coins:Math.max(0,Math.round(coins))
    });

    // 指定Gまで残り100G以内なら、このボーナスで終了
    if(targetG-g<=100){
      stopped='残り100G以内のボーナスで終了';
      break;
    }
  }

  const cash=Math.floor(coins/COIN_PER_1000*1000);
  const profit=cash-invest;
  const total=bb+reg;
  const comb=total?g/total:Infinity;

  document.getElementById('summaryCard').innerHTML=`
    <div class="result-title">今回の結果</div>
    <div class="stats">
      <div class="stat"><div class="k">機種 / 設定</div><div class="v" style="font-size:14px">${specs[machine].name} / ${setting}</div></div>
      <div class="stat"><div class="k">終了G</div><div class="v">${g.toLocaleString()}G</div></div>
      <div class="stat"><div class="k">BB / REG</div><div class="v">${bb} / ${reg}</div></div>
      <div class="stat"><div class="k">合算</div><div class="v">${total?'1/'+comb.toFixed(1):'—'}</div></div>
      <div class="stat"><div class="k">総投資</div><div class="v">${invest.toLocaleString()}円</div></div>
      <div class="stat"><div class="k">持ちメダル</div><div class="v">${Math.max(0,Math.round(coins)).toLocaleString()}枚</div></div>
      <div class="stat"><div class="k">回収</div><div class="v">${cash.toLocaleString()}円</div></div>
      <div class="stat"><div class="k">収支</div><div class="v ${profit>=0?'positive':'negative'}">${profit>=0?'+':''}${profit.toLocaleString()}円</div></div>
      <div class="stat"><div class="k">終了理由</div><div class="v" style="font-size:14px">${stopped}</div></div>
    </div>`;

  const tbody=document.getElementById('history');
  if(!rows.length){
    tbody.innerHTML=`<tr><td colspan="5" class="empty">${g>0?`${g.toLocaleString()}Gまで回し、ボーナス当選前に終了しました。`:'ボーナス当選前に終了しました。'}</td></tr>`;
    return;
  }

  tbody.innerHTML=rows.map(r=>`<tr>
    <td>${r.g.toLocaleString()}G</td>
    <td><span class="badge ${r.type==='BB'?'bb':'reg'}">${r.type}</span></td>
    <td>${r.gap.toLocaleString()}G</td>
    <td>${r.invest.toLocaleString()}円</td>
    <td>${r.coins.toLocaleString()}枚</td>
  </tr>`).join('');
}
</script>
</body>
</html>
